# FDS build properties.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Real androidx migration: sources are being rewritten to androidx imports.
# Jetifier is deliberately OFF - we are not byte-rewriting support-lib jars.
android.useAndroidX=true
android.enableJetifier=false

# Kept at the pre-AGP-8 defaults on purpose for this 2018 codebase:
#  - nonTransitiveRClass=false keeps library resources visible through the app's own R class,
#    which is what 486 files of 2018-era code expects. Flip to true once the source is clean.
#  - nonFinalResIds=false keeps R fields `static final` so switch(R.id.x) statements still compile.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
